<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I'm sorry</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sky"></div><div id="dawn"></div>
<canvas id="fx"></canvas><div id="flash"></div>
<audio id="music" src="music.mp3" loop preload="none"></audio>
<button id="mute" hidden aria-label="Toggle music">🔊</button>
<nav id="dots" aria-label="Steps"></nav>

<main>
  <section class="stage on" id="s0">
    <div class="bh">💔</div>
    <h1 class="hand big">I'm sorry</h1>
    <p class="soft">Please give me a minute to explain.</p>
    <button class="go" id="start" data-next>Read my letter</button>
  </section>

  <section class="stage" id="s1">
    <div class="paper" id="apology"></div>
    <button class="go hide" id="go1" data-next>Continue</button>
  </section>

  <section class="stage" id="s2">
    <h2>Remember us?</h2>
    <div class="stack" id="stack"></div>
    <p class="hint">tap the photo</p>
    <button class="go" data-next>Continue</button>
  </section>

  <section class="stage" id="s3">
    <h2>My promises to you</h2>
    <p class="hint" id="phint">seal each promise with a tap</p>
    <div class="promises" id="promises"></div>
    <button class="go" id="go3" data-next disabled>Continue</button>
  </section>

  <section class="stage" id="s4">
    <h2 class="big2">Will you forgive me?</h2>
    <div class="choice"><button class="yes" id="yes">Yes 💖</button><button class="no" id="no">No</button></div>
    <p class="hint">I'll wait as long as it takes.</p>
  </section>

  <section class="stage" id="s5">
    <div class="sun"></div>
    <div class="rainbow"></div>
    <h1 class="hand big" id="thanks"></h1>
    <p class="soft" id="thanksmsg"></p>
    <button class="ghost" id="replay">play again</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
